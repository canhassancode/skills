schema_version: "1.1"
name: build-escalates-unchecked-steps
description: At hand-back with one Verify step not run, build puts that step to the operator and leaves the pull request a draft.
tags: [build]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
