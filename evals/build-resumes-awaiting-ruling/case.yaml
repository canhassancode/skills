schema_version: "1.1"
name: build-resumes-awaiting-ruling
description: Running unattended with one Verify step not run, build leaves the pull request a draft, keeps the ticket at ready-to-build and writes a Resume line naming the step awaiting a ruling.
tags: [build]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit]
