schema_version: "1.1"
name: align-closes-child-into-ticket
description: A child spec agreed in session with its stubs and locked tests committed; align's close writes the spec into the child ticket's body at ready-to-build, replacing cut's drafts, and creates no spec file in the repo.
tags: [align, align-close]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
